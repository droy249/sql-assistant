
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SQL Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4 bg-slate-950 flex justify-between items-center">
        <h1 class="text-xl font-bold text-teal-400">📊 Sales SQL Agent</h1>
        <span class="text-xs bg-teal-500/10 text-teal-400 border border-teal-500/20 px-2 py-1 rounded">Claude-3.5-Sonnet</span>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col space-y-4 overflow-y-auto" id="chat-container">
        <div class="bg-slate-800/50 border border-slate-700/50 p-4 rounded-lg">
            <p class="text-sm font-semibold text-teal-400 mb-1">Agent Assistant</p>
            <p>Ask me any questions about our sales database! For example: "Which product category generated the most revenue?"</p>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="border-t border-slate-800 p-4 bg-slate-950">
        <form id="chat-form" class="max-w-4xl mx-auto flex space-x-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask your database a question..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-teal-500 text-slate-100"
                required
            >
            <button 
                type="submit" 
                class="bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold px-6 py-2 rounded-lg transition duration-200"
            >
                Ask
            </button>
        </form>
    </footer>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');

        // Points to your local FastAPI backend (we will update this when deploying)
        const BACKEND_URL = 'http://127.0.0.1:8000';

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = userInput.value.trim();
            if (!question) return;

            // 1. Add User's Message
            appendMessage('User', question, 'text-slate-300');
            userInput.value = '';

            // 2. Add temporary loading block
            const loadingId = appendMessage('Agent', 'Thinking and writing SQL...', 'text-teal-400 animate-pulse');

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove(); // Remove loading

                if (response.status === 200) {
                    appendAgentResponse(data);
                } else {
                    appendMessage('Security Error (400)', data.detail || 'Request blocked by guardrails.', 'text-red-400 bg-red-950/20 border border-red-500/20 p-3 rounded-lg');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('System Error', 'Failed to connect to backend server. Make sure it is running!', 'text-red-400 bg-red-950/20 border border-red-500/20 p-3 rounded-lg');
            }
        });

        function appendMessage(sender, text, classes) {
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            const div = document.createElement('div');
            div.id = id;
            div.className = `p-4 rounded-lg bg-slate-800 border border-slate-700 ${classes}`;
            div.innerHTML = `<p class="text-xs font-semibold mb-1 opacity-70">${sender}</p><p class="whitespace-pre-line">${text}</p>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function appendAgentResponse(data) {
            const div = document.createElement('div');
            div.className = 'p-4 rounded-lg bg-slate-800 border border-teal-900/50 text-slate-100 space-y-3';
            
            let queryBlock = '';
            if (data.query) {
                queryBlock = `
                    <div class="mt-2 bg-slate-950 p-2 rounded text-xs font-mono border border-slate-800 text-teal-300">
                        <p class="text-[10px] text-slate-500 uppercase font-sans font-bold tracking-wider mb-1">Generated SQL Query</p>
                        ${data.query}
                    </div>
                `;
            }

            div.innerHTML = `
                <p class="text-xs font-semibold text-teal-400">Agent Assistant</p>
                <p class="text-base">${data.answer}</p>
                ${queryBlock}
                <div class="flex space-x-4 text-[10px] text-slate-400 border-t border-slate-700/50 pt-2">
                    <span>⏱️ Time: ${data.response_time_ms}ms</span>
                    <span>🪙 Input Tokens: ${data.tokens_used.input}</span>
                    <span>🪙 Output Tokens: ${data.tokens_used.output}</span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
